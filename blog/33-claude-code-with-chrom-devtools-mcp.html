<script>
(function() {
    'use strict';
    var container = document.getElementById('comments-container');
    var loadingMsg = container.querySelector('.comments-loading');

    // Detect iOS Safari
    var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
    var isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);

    // Theme configuration
    var commentsTheme = 'github-light';
    var commentsThemeMode = 'auto';
    var LIGHT_THEME = 'github-light';
    var DARK_THEME = 'photon-dark';

    function getCurrentBlogTheme() {
        return document.documentElement.getAttribute('data-theme') || 'light';
    }

    function getUtterancesTheme() {
        if (commentsThemeMode === 'auto') {
            return getCurrentBlogTheme() === 'dark' ? DARK_THEME : LIGHT_THEME;
        }
        return commentsTheme;
    }

    function updateUtterancesTheme() {
        var iframe = container.querySelector('iframe');
        if (iframe && iframe.contentWindow) {
            var message = {
                type: 'set-theme',
                theme: getUtterancesTheme()
            };
            iframe.contentWindow.postMessage(message, 'https://utteranc.es');
        }
    }

    // Load Utterances dynamically
    var script = document.createElement('script');
    script.src = 'https://utteranc.es/client.js';
    script.setAttribute('repo', 'geoqiao/geoqiao.github.io');
    script.setAttribute('issue-number', '33');
    script.setAttribute('theme', getUtterancesTheme());
    script.setAttribute('crossorigin', 'anonymous');
    script.async = true;

    // Monitor iframe creation
    var checkInterval;
    var checkCount = 0;

    function checkIframe() {
        var iframe = container.querySelector('iframe');
        checkCount++;

        if (iframe && loadingMsg) {
            loadingMsg.style.display = 'none';
            clearInterval(checkInterval);
            // Listen for theme changes if in auto mode
            if (commentsThemeMode === 'auto') {
                var observer = new MutationObserver(function(mutations) {
                    mutations.forEach(function(mutation) {
                        if (mutation.attributeName === 'data-theme') {
                            updateUtterancesTheme();
                        }
                    });
                });
                observer.observe(document.documentElement, { attributes: true });
            }
            return true;
        }

        // Give up after 8 seconds
        if (checkCount > 40) {
            clearInterval(checkInterval);
            showError();
            return false;
        }
        return false;
    }

    function showError() {
        if (loadingMsg) {
            var msg = 'Comments may not be available.';
            if (isIOS && isSafari) {
                msg += '<br><small>iOS Safari may block third-party content.<br>Try "Settings → Safari → Disable Cross-Site Tracking"</small>';
            }
            loadingMsg.innerHTML = msg + '<br><a href="https://github.com/geoqiao/geoqiao.github.io/issues/33" target="_blank" rel="noopener">View or add comment on GitHub →</a>';
            loadingMsg.className = 'comments-error';
        }
    }

    script.onload = function() {
        // Start checking for iframe
        checkInterval = setInterval(checkIframe, 200);
    };

    script.onerror = function() {
        clearInterval(checkInterval);
        showError();
    };

    container.appendChild(script);

    // Absolute fallback after 12 seconds
    setTimeout(function() {
        clearInterval(checkInterval);
        if (loadingMsg && loadingMsg.style.display !== 'none') {
            showError();
        }
    }, 12000);
})();
</script>
