    <div class="post-content">
        <p>吃饭的时候突然想到，把历史比喻成一个车轮真的是生动形象且具体。</p>
<p>在某种角度上来看，这个车轮一直在向前滚动；另一种种角度上，车轮又在不断循环，车轮的材质变化，滚动的速度也不一样。</p>
<p>一些东西一直再改变，但一些东西一直没变。</p>

<script>
(function() {
    'use strict';

    // Fix Safari lazy-loading bug: utterances iframe may never load
    // because IntersectionObserver sees zero-height parent container.
    var originalInsertAdjacentHTML = Element.prototype.insertAdjacentHTML;
    Element.prototype.insertAdjacentHTML = function(position, text) {
        if (typeof text === 'string' && text.indexOf('<iframe') !== -1 && text.indexOf('loading="lazy"') !== -1) {
            text = text.replace(/loading="lazy"/g, '');
        }
        return originalInsertAdjacentHTML.call(this, position, text);
    };

    var container = document.getElementById('comments-container');
    var loadingMsg = container.querySelector('.comments-loading');

    // Detect iOS Safari
    var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
    var isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);

    var DARK_THEME = 'photon-dark';

    function getUtterancesTheme() {
        return DARK_THEME;
    }

    function updateUtterancesTheme() {
        var iframe = container.querySelector('iframe');
        if (iframe && iframe.contentWindow) {
            var message = {
                type: 'set-theme',
                theme: getUtterancesTheme()
            };
            iframe.contentWindow.postMessage(message, 'https://utteranc.es');
        }
    }

    // Load Utterances dynamically
    var script = document.createElement('script');
    script.src = 'https://utteranc.es/client.js';
    script.setAttribute('repo', 'geoqiao/geoqiao.github.io');
    script.setAttribute('issue-number', '4');
    script.setAttribute('theme', getUtterancesTheme());
    script.async = true;

    // Monitor iframe creation
    var checkInterval;
    var checkCount = 0;

    function checkIframe() {
        var iframe = container.querySelector('iframe');
        checkCount++;

        if (iframe && loadingMsg) {
            loadingMsg.style.display = 'none';
            clearInterval(checkInterval);
            return true;
        }

        // Give up after 15 seconds (mobile networks need more time)
        if (checkCount > 75) {
            clearInterval(checkInterval);
            showError();
            return false;
        }
        return false;
    }

    function showError() {
        if (loadingMsg) {
            var msg = 'Comments may not be available.';
            if (isIOS && isSafari) {
                msg += '<br><small>iOS Safari may block third-party content.<br>Try turning off "Prevent Cross-Site Tracking" in Settings → Safari</small>';
            }
            loadingMsg.innerHTML = msg + '<br><a href="https://github.com/geoqiao/geoqiao.github.io/issues/4" target="_blank" rel="noopener">View or add comment on GitHub →</a>';
            loadingMsg.className = 'comments-error';
        }
    }

    script.onload = function() {
        // Start checking for iframe
        checkInterval = setInterval(checkIframe, 200);
    };

    script.onerror = function() {
        clearInterval(checkInterval);
        showError();
    };

    // Listen for actual Utterances resize message (most reliable signal)
    window.addEventListener('message', function(e) {
        if (e.origin === 'https://utteranc.es' && e.data && e.data.type === 'resize' && loadingMsg) {
            loadingMsg.style.display = 'none';
            clearInterval(checkInterval);
        }
    });

    container.appendChild(script);

    // Absolute fallback after 15 seconds
    setTimeout(function() {
        clearInterval(checkInterval);
        if (loadingMsg && loadingMsg.style.display !== 'none') {
            showError();
        }
    }, 15000);
})();
</script>
