name: Sync blog Issue comments

on:
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:
  schedule:
    - cron: "24 3 * * *"

permissions: {}

# Serialize both workflows that write the snapshot. Scheduled full sync also
# reconciles events dropped while the queue was full.
concurrency:
  group: content-${{ github.ref }}
  queue: max

jobs:
  sync:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'issue_comment' || github.event.issue.pull_request == null)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
    steps:
      - name: Check out current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Refresh the comment snapshot
        id: comments
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          # The script checks the current manifest before contacting the API.
          args=()
          if [ -n "$ISSUE_NUMBER" ]; then args=(--issue "$ISSUE_NUMBER"); fi
          node scripts/sync-issue-comments.mjs "${args[@]}"
          git add --all data/issue-comments
          if ! git diff --cached --quiet; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      - name: Install pnpm
        if: steps.comments.outputs.changed == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Validate the snapshot and static site
        if: steps.comments.outputs.changed == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm check
          pnpm test

      - name: Commit the comment snapshot
        if: steps.comments.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "content: refresh Issue comments"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
