name: Build and deploy geoqiao.me

on:
  workflow_dispatch:
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened, deleted, transferred]
  push:
    paths:
      - ".github/workflows/pages.yml"
      - "config.yaml"
      - "content-migrations/**"
      - "scripts/**"
      - "tests/**"
      - "theme/**"
      - "CNAME"

permissions: {}
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'issues' || contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pages: read
    outputs:
      skipped-issues: ${{ steps.site.outputs.skipped-issues }}
    steps:
      - name: Checkout site repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
          version: "0.12.20"

      - name: Test site migration tooling
        run: uv run --no-project --python 3.14 --with pyyaml==6.0.3 python -m unittest discover -s tests -v

      - name: Build the site
        id: site
        uses: geoqiao/escaping@34a5e51f74bfc9fc07a10174406c969d7f199525 # v0.5.1
        with:
          config: config.yaml

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ steps.site.outputs.output }}

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Report skipped Issues
        if: needs.build.outputs.skipped-issues != ''
        env:
          SKIPPED: ${{ needs.build.outputs.skipped-issues }}
        run: |
          echo "::error title=Some Issues were not published::Issues $SKIPPED have errors; the build job summary says what to fix. Everything else is live."
          exit 1
