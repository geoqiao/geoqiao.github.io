name: Build and deploy geoqiao.me

on:
  workflow_dispatch:
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened, deleted, transferred]
  push:
    paths:
      - ".github/workflows/pages.yml"
      - "config.yaml"
      - "content-migrations/**"
      - "scripts/**"
      - "tests/**"
      - "src/**"
      - "public/**"
      - "astro.config.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - "CNAME"

permissions: {}
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'issues' || contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    outputs:
      skipped-issues: ${{ steps.content.outputs.skipped-issues }}
    steps:
      - name: Checkout site repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
          version: "0.12.20"

      - name: Test site migration tooling
        run: uv run --no-project --python 3.14 --with pyyaml==6.0.3 python -m unittest discover -s tests -v

      - name: Export the content
        id: content
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          status=0
          uvx --python 3.14 --from 'escpe==0.6.0' escpe export --config config.yaml || status=$?
          # 2: exported, but some Issues were skipped; the skipped-issues output says which.
          if [ "$status" -eq 2 ]; then exit 0; fi
          exit "$status"

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install site dependencies
        run: pnpm install --frozen-lockfile

      - name: Test the Markdown allowlist
        run: pnpm test

      - name: Build the site
        env:
          CONTENT_DIR: ${{ steps.content.outputs.output }}
          # Reads the public language and topics of the projects in config.yaml.
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Report skipped Issues
        if: needs.build.outputs.skipped-issues != ''
        env:
          SKIPPED: ${{ needs.build.outputs.skipped-issues }}
        run: |
          echo "::error title=Some Issues were not published::Issues $SKIPPED have errors; the build job summary says what to fix. Everything else is live."
          exit 1
