name: Build and deploy geoqiao.me

on:
  workflow_dispatch:
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened]
  push:
    paths:
      - ".github/workflows/pages.yml"
      - "config.yaml"
      - "content-migrations/**"
      - "scripts/**"
      - "tests/**"
      - "theme/**"
      - "CNAME"

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    env:
      ESCAPING_SHA: 3d17f8131c6b68bb6e7436adca4663caadce4cae
    steps:
      - name: Checkout site repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout pinned escaping compiler
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: geoqiao/escaping
          ref: ${{ env.ESCAPING_SHA }}
          path: compiler
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
          version: "0.12.0"

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Install locked noneditable compiler
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/compiler-venv
          UV_CACHE_DIR: ${{ runner.temp }}/compiler-cache
        run: |
          set -euo pipefail
          printf '%s\n' "UV_PROJECT_ENVIRONMENT=$UV_PROJECT_ENVIRONMENT" "UV_CACHE_DIR=$UV_CACHE_DIR" >> "$GITHUB_ENV"
          bash compiler/starter/.github/scripts/install.sh \
            "$GITHUB_WORKSPACE/compiler" "$ESCAPING_SHA" 3.14 >> "$GITHUB_STEP_SUMMARY"

      - name: Test site migration tooling
        run: '"$UV_PROJECT_ENVIRONMENT/bin/python" -m unittest discover -s tests -v'

      - name: Generate site from the site Config
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          "$UV_PROJECT_ENVIRONMENT/bin/escpe"
          --config "$GITHUB_WORKSPACE/config.yaml"

      - name: Render and validate final Pages artifact
        run: >-
          "$UV_PROJECT_ENVIRONMENT/bin/python" scripts/render_slug_redirects.py
          --map content-migrations/blog-slugs-2026-08.json
          --output output
          --repository-root "$GITHUB_WORKSPACE"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: output

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
