name: Build and deploy geoqiao.me

on:
  workflow_dispatch:
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened]
  push:
    paths:
      - ".github/workflows/pages.yml"
      - "config.yaml"
      - "theme/**"
      - "CNAME"

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - name: Checkout site repository
        uses: actions/checkout@v4

      - name: Checkout pinned escaping compiler
        uses: actions/checkout@v4
        with:
          repository: geoqiao/escaping
          ref: 92533f3405fc15f24a72ca344ee8d1c67bb41b24
          path: compiler

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: compiler/uv.lock
          version: "0.12.0"

      - name: Set up Python
        run: uv python install 3.11

      - name: Generate site from the site Config
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          uv run --project "$GITHUB_WORKSPACE/compiler" --frozen
          blog-gen --config "$GITHUB_WORKSPACE/config.yaml"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
