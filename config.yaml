# ============================================
# 仓库配置（必填）
# ============================================
github:
  repo: geoqiao/geoqiao.github.io
  allowed_authors:
    - geoqiao

# ============================================
# 站点身份配置（必填）
# 拥有标题、作者显示名、规范 HTTPS 源、描述、语言和导航
# ============================================
site:
  title: Geo Qiao
  url: https://geoqiao.me/
  author: Geo Qiao
  description: "金融行业的贷后策略分析师，记录 AI 工作流、Python 实践与个人项目。"
  language: zh-CN
  navigation:
    items:
      - name: Home
        url: /
      - name: Blog
        url: /blog/
      - name: Projects
        url: /projects/
      - name: Tags
        url: /tags/
      - name: About
        url: /about/
      - name: RSS
        url: /atom.xml

# ============================================
# 站点档案（Site Profile）
# 头像与站点级链接；详细 About 叙述属于 About Issue Content
# ============================================
profile:
  bio: Post-loan strategy analyst by day. Usually tinkering with Python, TypeScript, or AI coding workflows.
  avatar: /assets/images/avatar.png
  links:
    - name: GitHub
      url: https://github.com/geoqiao
    - name: Twitter/X
      url: https://twitter.com/geoqiao

# ============================================
# About Issue 选择（必填）
# 通过不可变 Issue 编号选择 About 内容
# ============================================
about:
  issue_number: 42

# ============================================
# 生成路径配置
# page_size 为正整数，默认 10
# ============================================
paths:
  output: output
  page_size: 10

# ============================================
# Geo 主题（theme/theme.yaml 声明这些选项）
# ============================================
theme:
  use: ./theme
  options:
    featured_posts: [41, 67, 49]
    show_powered_by: true
    comments_theme: github-light
    comments_theme_mode: auto

# ============================================
# SEO 配置
# ============================================
seo:
  google_search_console: DRggZlykSzc8M9TyaS0BPSRE7Kvw8W9hHt5pZrIMm3Y
  social_image: https://raw.githubusercontent.com/geoqiao/geoqiao.github.io/071e377fd6cc319f9ac7db686c3d4531e07be8d8/assets/social/og.png
  social_image_alt: "Geo Qiao：AI 工作流、Python 实践与个人项目。手绘笔记本上的洋红色个人标记，旁边是工具箱和钢笔。"

# ============================================
# 评论配置
# repo 留空时回退到 github.repo；配色见 theme.options.comments_theme*
# ============================================
comments:
  enabled: true

# ============================================
# 项目目录：/projects/ 与每个项目的产品首页 /projects/<slug>/
# 产品首页模板是 theme/projects/<slug>.html
# ============================================
projects:
  - slug: pi-tools
    title: pi-tools
    repository: geoqiao/pi-tools
    summary: 为 Pi 提供结构化提问与本地 AI 用量报告，支持 Paseo 等 RPC 客户端。
    image: /assets/images/projects/pi-tools-logo.webp
    featured: true
    order: 1
    fallback_metadata:
      language: TypeScript

  - slug: escaping
    title: escaping
    repository: geoqiao/escaping
    summary: 把 GitHub Issues 变成个人网站。你正在读的这个博客，也由它驱动。
    image: /assets/images/projects/escaping-logo.webp
    links:
      - name: 访问网站
        url: https://geoqiao.me/
    featured: true
    order: 2
    fallback_metadata:
      language: Python
      topics: [github-issues, static-site-generator, github-pages]

  - slug: md2xarticle
    title: md2xarticle
    website: https://md2xarticle.com/
    summary: 把 Markdown 变成 X 长文，处理本地图片、表格与 Mermaid 图表。
    image: /assets/images/projects/md2xarticle.svg
    links:
      - name: 打开编辑器
        url: https://md2xarticle.com/
    featured: true
    order: 3

  - slug: paseo-stuff
    title: paseo-stuff
    repository: geoqiao/paseo-stuff
    summary: 为 Paseo 添加清晰的工具输出、数学公式排版，以及 DeepSeek 与 MaKa 接入。
    image: /assets/images/projects/paseo-stuff-logo.svg
    featured: true
    order: 4
    fallback_metadata:
      language: TypeScript
