# ============================================
# 仓库配置（必填）
# ============================================
github:
  repo: geoqiao/geoqiao.github.io
  allowed_authors:
    - geoqiao

# ============================================
# 站点身份配置（必填）
# 拥有标题、作者显示名、规范 HTTPS 源、描述、语言和导航
# ============================================
site:
  title: Geo Qiao
  url: https://geoqiao.me/
  author: Geo Qiao
  description: ""
  language: zh-CN
  thesis:
    - Escaping is a static blog system based on GitHub Issues.
    - Generated with Python + Jinja2, deployed via GitHub Actions.
  navigation:
    items:
      - name: Home
        url: /
      - name: Blog
        url: /blog/
      - name: Projects
        url: /projects/
      - name: Tags
        url: /tags/
      - name: About
        url: /about/
      - name: RSS
        url: /atom.xml

# ============================================
# 站点档案（Site Profile）
# 头像与站点级链接；详细 About 叙述属于 About Issue Content
# ============================================
profile:
  avatar: https://raw.githubusercontent.com/geoqiao/geoqiao.github.io/c034e81a8451f18d771f8f8c3523d6ad127abf35/assets/profile/avatar.png
  links:
    - name: GitHub
      url: https://github.com/geoqiao
    - name: Twitter/X
      url: https://twitter.com/geoqiao

# ============================================
# About Issue 选择（必填）
# 通过不可变 Issue 编号选择 About 内容
# ============================================
about:
  issue_number: 42

# ============================================
# 使用声明（开源相关，建议保留）
# ============================================
branding:
  show_powered_by: true
  powered_by_text: escaping
  powered_by_url: https://github.com/geoqiao/escaping
  source_link_url: https://github.com/geoqiao/escaping

# ============================================
# 生成路径配置
# page_size 为正整数，默认 10
# Home 最近 Blog 数量在 v1 固定为 5，不可配置
# ============================================
paths:
  output: output
  page_size: 10

theme:
  source: builtin
  name: Quiet

# ============================================
# SEO 配置
# ============================================
seo:
  google_search_console: DRggZlykSzc8M9TyaS0BPSRE7Kvw8W9hHt5pZrIMm3Y

# ============================================
# 评论配置
# repo 留空时回退到 github.repo
# theme_mode: auto 跟随博客主题
# ============================================
comments:
  enabled: true
  repo: ""
  theme: github-light
  theme_mode: auto

# ============================================
# Projects（站点维护的公开项目目录）
# GitHub metadata 会在构建时刷新；fallback 只保留稳定字段
# ============================================
projects:
  - slug: pi-tools
    title: pi-tools
    repository: geoqiao/pi-tools
    summary: 为 Pi / Paseo 提供结构化提问、旁支对话和本地 AI 用量报告。
    image: https://raw.githubusercontent.com/geoqiao/geoqiao/0e114158f698e754cf1bd840ecbf264ef67e2dc5/assets/pi-tools-icon.png
    featured: true
    order: 1
    fallback_metadata:
      language: TypeScript

  - slug: escaping
    title: escaping
    repository: geoqiao/escaping
    summary: 把 GitHub Issues 变成个人网站。你正在读的这个博客，也由它驱动。
    image: https://raw.githubusercontent.com/geoqiao/escaping/3b0b8d568462cf9ac81d9bef2dbba683ce57ec39/docs/assets/escaping-logo.png
    links:
      - name: 访问网站
        url: https://geoqiao.me/
    featured: true
    order: 2
    fallback_metadata:
      language: Python
      topics:
        - github-issues
        - static-site-generator
        - github-pages

  - slug: oh-my-share
    title: oh-my-share
    repository: geoqiao/oh-my-share
    summary: 为 Agent 提供 A 股、港股和美股的公开市场数据，在本地命令行使用。
    image: https://raw.githubusercontent.com/geoqiao/oh-my-share/dee76d7aa8adff7f9fcb4c3c3b67c6f47757c0ff/docs/assets/oh-my-share-logo.png
    featured: true
    order: 3
    fallback_metadata:
      language: Python

  - slug: jojo-codex-pet
    title: JoJo Codex Pet
    repository: geoqiao/jojo-codex-pet
    summary: JoJo 主题的 Codex 宠物。非官方、非商业，是一个纯粹好玩的兴趣项目。
    image: https://raw.githubusercontent.com/geoqiao/jojo-codex-pet/39c3e3e22b822bedfb9413ea08f56319a79056c6/apps/web/public/pilot-bases/part-03-jotaro-kujo-card-320.webp
    links:
      - name: 看看宠物
        url: https://pixelstand.pet/
    featured: true
    order: 4
    fallback_metadata:
      language: Astro
      topics:
        - codex-pet
        - fan-project
        - pixel-art

# ============================================
# 安全配置
# token_env 动态决定 Token 环境变量名，不硬编码
# ============================================
security:
  token_env: GITHUB_TOKEN
