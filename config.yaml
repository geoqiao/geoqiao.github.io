# ============================================
# 仓库配置（必填）
# ============================================
github:
  repo: geoqiao/geoqiao.github.io
  allowed_authors:
    - geoqiao

# ============================================
# 站点身份配置（必填）
# 拥有标题、作者显示名、规范 HTTPS 源、描述、语言和导航
# ============================================
site:
  title: Geo Qiao
  url: https://geoqiao.me/
  author: Geo Qiao
  description: "金融行业的贷后策略分析师，记录 AI 工作流、Python 实践与个人项目。"
  language: zh-CN
  featured_posts: [41, 67, 49]
  thesis:
    - Escaping is a static blog system based on GitHub Issues.
    - Generated with Python + Jinja2, deployed via GitHub Actions.
  navigation:
    items:
      - name: Home
        url: /
      - name: Blog
        url: /blog/
      - name: Projects
        url: /projects/
      - name: Tags
        url: /tags/
      - name: About
        url: /about/
      - name: RSS
        url: /atom.xml

# ============================================
# 站点档案（Site Profile）
# 头像与站点级链接；详细 About 叙述属于 About Issue Content
# ============================================
profile:
  tagline: I make tools for the way I work — and a few things just for fun.
  bio: Post-loan strategy analyst by day. Usually tinkering with Python, TypeScript, or AI coding workflows.
  avatar: /templates/Geo/static/images/avatar.png
  links:
    - name: GitHub
      url: https://github.com/geoqiao
    - name: Twitter/X
      url: https://twitter.com/geoqiao

# ============================================
# About Issue 选择（必填）
# 通过不可变 Issue 编号选择 About 内容
# ============================================
about:
  issue_number: 42

# ============================================
# 使用声明（开源相关，建议保留）
# ============================================
branding:
  show_powered_by: true
  powered_by_text: escaping
  powered_by_url: https://github.com/geoqiao/escaping
  source_link_url: https://github.com/geoqiao/escaping

# ============================================
# 生成路径配置
# page_size 为正整数，默认 10
# Home 最近 Blog 数量在 v1 固定为 5，不可配置
# ============================================
paths:
  output: output
  page_size: 10

theme:
  source: local
  name: Geo
  path: theme

# ============================================
# SEO 配置
# ============================================
seo:
  google_search_console: DRggZlykSzc8M9TyaS0BPSRE7Kvw8W9hHt5pZrIMm3Y
  social_image: https://raw.githubusercontent.com/geoqiao/geoqiao.github.io/071e377fd6cc319f9ac7db686c3d4531e07be8d8/assets/social/og.png
  social_image_alt: "Geo Qiao：AI 工作流、Python 实践与个人项目。手绘笔记本上的洋红色个人标记，旁边是工具箱和钢笔。"

# ============================================
# 评论配置
# repo 留空时回退到 github.repo
# theme_mode: auto 跟随博客主题
# ============================================
comments:
  enabled: true
  repo: ""
  theme: github-light
  theme_mode: auto

# ============================================
# Geo 项目目录与产品首页由 theme/projects.yaml 和 theme/build.py 维护。
# 原生 compiler config 不复制该目录。
# ============================================
projects: []

# ============================================
# 安全配置
# token_env 动态决定 Token 环境变量名，不硬编码
# ============================================
security:
  token_env: GITHUB_TOKEN
