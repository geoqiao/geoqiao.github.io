# ============================================
# 仓库配置（必填）
# ============================================
github:
  repo: geoqiao/geoqiao.github.io
  allowed_authors:
    - geoqiao

# ============================================
# 站点身份配置（必填）
# 拥有标题、作者显示名、规范 HTTPS 源、描述、语言和导航
# ============================================
site:
  title: Geo Qiao
  url: https://geoqiao.me/
  author: Geo Qiao
  description: ""
  language: zh-CN
  thesis:
    - 演悲欢离合，当代岂无前代事？
    - 观抑扬褒贬，座中常有剧中人。
  navigation:
    items:
      - name: Blog
        url: /blog/
      - name: Ideas
        url: /ideas/
      - name: Projects
        url: /projects/
      - name: Tags
        url: /tags/
      - name: About
        url: /about/
      - name: RSS
        url: /atom.xml

# ============================================
# 站点档案（Site Profile）
# 仅包含头像、简短标签、简介和链接；详细 About 叙述属于 About Issue Content
# ============================================
profile:
  avatar: /templates/geoqiao.me/static/images/author-mark.png
  tagline: 贷后策略分析师 / tool tinkerer
  bio: |
    你好，我是 geoqiao。
    一名金融行业的贷后策略分析师，喜欢折腾工具，也享受用代码解决重复性工作。
    工作之余，我喜欢记录生活中的碎片。
  links:
    - name: GitHub
      url: https://github.com/geoqiao
    - name: Twitter/X
      url: https://twitter.com/geoqiao

# ============================================
# About Issue 选择（必填）
# 通过不可变 Issue 编号选择 About 内容
# ============================================
about:
  issue_number: 42

# ============================================
# 使用声明（开源相关，建议保留）
# ============================================
branding:
  show_powered_by: true
  powered_by_text: escaping
  powered_by_url: https://github.com/geoqiao/escaping
  source_link_url: https://github.com/geoqiao/escaping

# ============================================
# 生成路径配置
# page_size 为正整数，默认 10
# Home 最近 Blog 数量在 v1 固定为 5，不可配置
# ============================================
paths:
  output: output
  page_size: 10

theme:
  source: builtin
  name: geoqiao.me

# ============================================
# SEO 配置
# ============================================
seo:
  google_search_console: DRggZlykSzc8M9TyaS0BPSRE7Kvw8W9hHt5pZrIMm3Y

# ============================================
# 评论配置
# repo 留空时回退到 github.repo
# theme_mode: auto 跟随博客主题
# ============================================
comments:
  repo: ""
  theme: github-light
  theme_mode: auto

# ============================================
# Projects（站点维护的公开项目目录）
# GitHub metadata 会在构建时刷新；fallback 只保留稳定字段
# ============================================
projects:
  - slug: escaping
    title: escaping
    repository: geoqiao/escaping
    summary: 以 GitHub Issues 为内容源、带严格校验与分阶段发布的个人静态站点生成器。
    featured: true
    order: 1
    fallback_metadata:
      language: Python
      topics:
        - github-issues
        - static-site-generator
        - github-pages

  - slug: jojo-codex-pet
    title: JoJo Codex Pet
    repository: geoqiao/jojo-codex-pet
    summary: 非官方、非商业的 JoJo 主题 Codex Pet V2 图鉴、安装包与双语画廊。
    featured: true
    order: 2
    fallback_metadata:
      language: Astro
      topics:
        - codex-pet
        - fan-project
        - pixel-art

# ============================================
# 安全配置
# token_env 动态决定 Token 环境变量名，不硬编码
# ============================================
security:
  token_env: GITHUB_TOKEN
