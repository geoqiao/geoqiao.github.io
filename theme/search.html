<dialog id="site-search" class="search-dialog" aria-labelledby="search-title" lang="en">
  <h2 id="search-title" class="visually-hidden">Search</h2>
  <form class="search-form" role="search">
    <div class="search-input-row">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg>
      <input id="search-query" type="search" maxlength="200" placeholder="Search…" aria-label="Search articles and projects" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false" aria-describedby="search-scope" autofocus>
      <button class="search-close" type="button" aria-label="Close search"><span class="search-close-key" aria-hidden="true">Esc</span><span class="search-close-text" aria-hidden="true">Cancel</span></button>
    </div>
  </form>
  <p id="search-scope" class="search-scope">Titles, summaries and tags · Published content only</p>
  <p class="search-status" role="status" aria-live="polite" aria-atomic="true"></p>
  <div class="search-error" hidden>
    <button type="button" class="search-retry">Retry</button>
    <a href="{{ site.routes.blog.canonical_path }}">Browse Blog</a>
    <a href="{{ site.routes.tags.canonical_path }}">Browse Tags</a>
  </div>
  <ul class="search-results" aria-label="Search results"></ul>
  <div class="search-footer"><span>↑ ↓ or Tab to select</span><span>Esc to close</span></div>
</dialog>
