# Geo — geoqiao.me's own Theme. Set these under theme.options in config.yaml.
api: 3

options:
  featured_posts:
    type: posts
    default: []
    description: Blog Issue numbers shown under "Featured writing" on Home, in this order.
  show_powered_by:
    type: boolean
    default: true
    description: Show the escaping link in the footer.
  comments_theme:
    type: choice
    values: [github-light, github-dark, preferred-color-scheme, github-dark-orange, icy-dark, dark-blue, photon-dark, boxy-light, gruvbox-dark]
    default: github-light
    description: Utterances color theme used when comments_theme_mode is fixed.
  comments_theme_mode:
    type: choice
    values: [auto, fixed]
    default: auto
    description: auto follows Geo's light/dark mode; fixed always uses comments_theme.

# One product homepage per project: theme/projects/<slug>.html.
pages:
  - path: /projects/{slug}/
    template: projects/{slug}.html
    for_each: projects
